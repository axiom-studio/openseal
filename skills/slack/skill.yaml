apiVersion: openseal.dev/v1alpha1
kind: SkillDefinition
definition:
  id: openseal.slack-conversations
  version: 1.0.0
  name: Slack Conversations
  description: Receive and reply to governed Slack conversations.
  category: communication
  tags: [chat, messaging, slack]
  source:
    format: axiom.skill/v1
    publisher: OpenSeal
    identity: https://github.com/axiom-studio/openseal::openseal.slack-conversations
    registry: https://github.com/axiom-studio/openseal
    reference: openseal.slack-conversations
    resolvedVersion: 1.0.0
    license: MIT
  installers:
    - id: oci
      kind: oci
      label: Slack Skill service image
      package: axiomstudio/skill-slack-conversations:1.0.0
  transport:
    kind: tool
    endpoint: openseal-slack-conversations
  conversationAdapters:
    conversations:
      protocolVersion: openseal.conversation.adapter/v1
      name: Slack conversations
      description: Verify Slack Events API requests and deliver durable replies through Slack Web API.
      provider: slack
      endpointModes: [channel, direct]
      inboundEventTypes: [conversation.message.received]
      features: [mentions, threads]
      credentials:
        - name: SLACK_SIGNING_SECRET
          kind: slack-signing-secret
        - name: SLACK_CONNECTION
          kind: slack-oauth
          oauth2:
            provider: slack
            subject: installation
            scopes:
              - app_mentions:read
              - channels:history
              - chat:write
              - groups:history
              - im:history
              - mpim:history
      delivery:
        operations: [message.send]
        ordering: thread
        idempotency: required
        supportsAcknowledgementLookup: true
        supportsRetryAfter: true
      transport:
        kind: plugin
        ingressEndpoint: slack.conversation.ingress
        deliveryEndpoint: slack.conversation.deliver
        ingressCredentials: [SLACK_SIGNING_SECRET]
        deliveryCredentials: [SLACK_CONNECTION]
