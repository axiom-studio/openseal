version: "3.8"

services:
  openseal:
    build:
      context: .
      dockerfile: Dockerfile
    image: axiom-studio/openseal:latest
    container_name: openseal
    restart: unless-stopped
    ports:
      # Loopback only. The kernel API serves no authentication on any route, so
      # an unqualified "8080:8080" would bind the host side to 0.0.0.0 and put
      # every route — including the approval decision endpoint — on the network
      # for anyone who can route to this host.
      #
      # Docker installs its forward as a DNAT rule traversed BEFORE the host's
      # INPUT filter chain, so a `ufw default deny incoming` policy does not
      # block it. An operator who believes the host is firewalled would be
      # wrong.
      #
      # Remote access belongs behind an authenticating reverse proxy. Widen this
      # only together with that. Do NOT "fix" it by reverting
      # docker/daemon.yaml to loopback — the container must still bind
      # 0.0.0.0 for the published port to reach it at all.
      - "127.0.0.1:8080:8080"   # Versioned kernel API
    volumes:
      - ./docker/daemon.yaml:/app/daemon.yaml:ro
      # The image runs as the unprivileged `openseal` user. Docker seeds a new
      # named volume with the image directory's ownership, so a fresh volume is
      # writable. A volume created before the image dropped root is still owned
      # by uid 0 and the daemon cannot open its database: fix with
      #   docker compose run --rm --user root openseal chown -R openseal:openseal /app/data
      # or discard it with `docker compose down -v`.
      - openseal-data:/app/data
    environment:
      - OPENSEAL_LOG_LEVEL=info
    healthcheck:
      # 127.0.0.1, not localhost — see the note on the Dockerfile HEALTHCHECK.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M

volumes:
  openseal-data:
    driver: local
