logLevel: info
api:
  # Bind every interface inside the container. A published port arrives on the
  # container's own interface, not its loopback, so a 127.0.0.1 bind here makes
  # `-p 8080:8080` connect to nothing. The container's network namespace is the
  # isolation boundary; exposure remains the operator's choice of whether to
  # publish the port. The built-in default in internal/daemon/config.go stays
  # loopback, which is the right default for a daemon run directly on a host.
  listenAddr: 0.0.0.0:8080
storage:
  driver: sqlite
  path: /app/data/openseal.db
  artifactsPath: /app/data/artifacts
