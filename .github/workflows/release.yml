name: Release

# Triggered by pushing a semver tag, e.g. v0.1.0 or v0.1.0-rc1.
on:
  push:
    tags:
      - 'v*.*.*'

# Tags are immutable, so cancelling an in-progress run buys nothing and risks
# half-publishing. Default token scope is read-only; jobs opt into their writes.
permissions:
  contents: read

# The axiom-studio org Actions policy is reported (in a sibling repository's
# workflows) to allow actions only from org-owned repositories, while other
# sibling repositories use marketplace actions freely. The two cannot both be
# true, and a workflow built on marketplace actions does not merely degrade if
# the restriction is real — it never starts. These workflows therefore use no
# `uses:` steps at all: that is the strict subset, correct under either policy.

jobs:
  # ---------------------------------------------------------------------------
  # Create the release up front, as a draft, so every build job has somewhere to
  # put its asset the moment it finishes.
  #
  # This is what replaces artifact-passing between jobs. The upload actions are
  # off the table along with every other `uses:` step, and the artifact REST API
  # is awkward to drive by hand, but `gh` is preinstalled on all hosted runners
  # and is a CLI rather than an action, so it is unaffected by the policy.
  #
  # The release stays a draft until the assembly job publishes it, so a partial
  # or failed run never leaves a half-populated release visible to users.
  prepare:
    name: Create the draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create the draft release if it does not already exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists; reusing it"
            exit 0
          fi
          # Pre-release when the tag carries a suffix such as -rc1.
          PRERELEASE=""
          case "$TAG" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$TAG" \
            --draft \
            $PRERELEASE \
            --title "OpenSeal ${TAG}" \
            --notes "Draft release. Assets are uploaded by the build jobs; this becomes visible once the assembly job publishes it."

  # ---------------------------------------------------------------------------
  # Standalone binary, one native build per target.
  #
  # Why native rather than a single cross-building job: the daemon links
  # github.com/mattn/go-sqlite3, so cgo is mandatory. `CGO_ENABLED=0` does not
  # degrade the binary, it fails to compile outright (undefined: sqlite3.Error
  # and two siblings in pkg/runtime/authoring_apply_sqlite.go). Cross-compiling
  # cgo needs a C toolchain per target, and darwin additionally needs the
  # platform SDK. Building natively on each runner avoids all of it — and the
  # desktop job needs these same runners regardless, so it costs no extra
  # infrastructure.
  #
  # Every leg runs on a GitHub-hosted runner, including linux. That is
  # deliberate: hosted images ship a Go toolchain, so all four legs share one
  # setup path. The self-hosted fleet is used where it actually earns its
  # keep — the container job, which needs a Docker daemon.
  #
  # linux/arm64 is NOT built here. It is the one target with no native runner
  # available, so it would need a cross toolchain that could not be verified
  # while writing this. Adding it later means either an arm64 runner (native,
  # preferred) or gcc-aarch64-linux-gnu with CC set and CGO_ENABLED=1. The
  # container job publishes a linux/arm64 image independently of this gap.
  binary:
    name: Binary (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: macos-13        # Intel; macos-latest is Apple silicon
            goos: darwin
            goarch: amd64
          - runner: macos-latest    # Apple silicon
            goos: darwin
            goarch: arm64
          - runner: windows-latest
            goos: windows
            goarch: amd64

    defaults:
      run:
        # Windows runners default to PowerShell. One shell for every leg keeps
        # the steps identical instead of forking per platform.
        shell: bash

    steps:
      - name: Check out the tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # Auth via a transient http.extraHeader passed per-command — never
          # written to .git/config, so the token is not left on the runner's
          # filesystem for later steps to read.
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')" \
            fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD

      - name: Set up the Go toolchain named by go.mod
        run: |
          set -euo pipefail
          WANT="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          if [ -z "$WANT" ]; then
            echo "::error::could not read the go directive from go.mod" >&2
            exit 1
          fi
          if ! command -v go >/dev/null 2>&1; then
            echo "::error::no Go toolchain on ${{ matrix.runner }}; this job relies on the hosted image providing one" >&2
            exit 1
          fi
          # GOTOOLCHAIN is left at its default (auto) on purpose. When the
          # installed Go is older than the version go.mod requires, the go
          # command fetches that exact toolchain as a module and verifies it
          # against the Go checksum database. That is a stronger guarantee than
          # downloading a tarball by hand, and it is identical on all four
          # runners. Assert the result rather than trusting it.
          GOT="$(go version | awk '{print $3}' | sed 's/^go//')"
          echo "go.mod wants ${WANT}; toolchain resolved to ${GOT}"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::Go toolchain is ${GOT} but go.mod requires ${WANT}" >&2
            exit 1
          fi

      - name: Build
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          BIN=openseal
          if [ "${{ matrix.goos }}" = "windows" ]; then BIN=openseal.exe; fi
          # -w -s strips DWARF and the symbol table; the unstripped binary is
          # ~96 MB. Matches what the Dockerfile already does.
          #
          # No -X version stamping: cmd/openseal/commands/root.go declares
          # `const version`, and -X can only write to a string *variable*.
          # Changing that const to a var is a source change and belongs in its
          # own work item, not smuggled into a pipeline commit.
          go build -trimpath -ldflags="-w -s" -o "$BIN" ./cmd/openseal
          test -x "$BIN" || test -f "$BIN"

      - name: Smoke-test the binary
        # Skipped when the build is not executable on the runner that made it.
        # Every current matrix leg is native, so this always runs today; the
        # guard keeps the step honest if a cross-built target is added later.
        if: ${{ !(matrix.goos == 'windows' && runner.os != 'Windows') }}
        run: |
          set -euo pipefail
          BIN=./openseal
          if [ "${{ matrix.goos }}" = "windows" ]; then BIN=./openseal.exe; fi
          # `version`, not `--version`: this CLI is subcommand-based and has no
          # --version flag; it would be rejected as an unknown command. The
          # output is asserted below rather than trusting the exit status, so
          # this proves the binary runs and reports itself.
          OUT="$("$BIN" version)"
          echo "$OUT"
          case "$OUT" in
            *OpenSeal*) ;;
            *) echo "::error::unexpected version output: ${OUT}" >&2; exit 1 ;;
          esac

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="openseal_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/${STAGE}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp openseal.exe "dist/${STAGE}/"
          else
            cp openseal "dist/${STAGE}/"
          fi
          cp LICENSE README.md "dist/${STAGE}/"
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # Git Bash ships no `zip`. Prefer 7z when the image provides it and
            # fall back to PowerShell, rather than assuming either is present.
            if command -v 7z >/dev/null 2>&1; then
              7z a -tzip "${STAGE}.zip" "${STAGE}" >/dev/null
            else
              powershell -NoProfile -NonInteractive -Command \
                "Compress-Archive -Path '${STAGE}' -DestinationPath '${STAGE}.zip' -Force"
            fi
          else
            tar -czf "${STAGE}.tar.gz" "${STAGE}"
          fi
          rm -rf "${STAGE}"
          ls -l

      - name: Upload the archive to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="openseal_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then ARCHIVE="dist/${STAGE}.zip"; else ARCHIVE="dist/${STAGE}.tar.gz"; fi
          # An empty or missing archive fails the job rather than uploading
          # nothing and letting the assembly job publish a release with a hole
          # in it.
          test -s "$ARCHIVE" || { echo "::error::archive ${ARCHIVE} is missing or empty" >&2; exit 1; }
          # --clobber so re-running a failed leg replaces its asset instead of
          # erroring on a name that already exists.
          gh release upload "${GITHUB_REF_NAME}" "$ARCHIVE" --clobber
          echo "uploaded ${ARCHIVE}"

  # ---------------------------------------------------------------------------
  # Container images, published to GHCR.
  #
  # Runs on a hosted runner rather than the self-hosted fleet: this job needs a
  # Docker daemon with buildx, which hosted images provide and which could not
  # be confirmed on the fleet from here.
  #
  # linux/arm64 is built by emulating the builder stage. That is genuinely slow
  # for this project — the image compiles a cgo SQLite driver from C under QEMU,
  # not a pure-Go binary — so the timeout is generous on purpose.
  container:
    name: Container image
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')" \
            fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD

      - name: Enable cross-architecture emulation and a buildx builder
        run: |
          set -euo pipefail
          # binfmt handlers for the non-native architecture. This is the plain
          # docker equivalent of the QEMU setup action.
          docker run --privileged --rm tonistiigi/binfmt:qemu-v8.1.5 --install arm64
          docker buildx create --name openseal --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Log in to the container registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the multi-architecture image
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Lower-case the owner: image references must be lower-case, but the
          # org name's casing is whatever GitHub reports.
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          # `latest` only moves for a final release. A pre-release tag such as
          # v0.2.0-rc1 publishes its version tag and nothing else, so `latest`
          # never silently points at a release candidate.
          TAGS=( --tag "${IMAGE}:${VERSION}" )
          case "${GITHUB_REF_NAME}" in
            *-*) echo "pre-release ${GITHUB_REF_NAME}: not moving :latest" ;;
            *)   TAGS+=( --tag "${IMAGE}:latest" ) ;;
          esac

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            "${TAGS[@]}" \
            --label "org.opencontainers.image.title=OpenSeal" \
            --label "org.opencontainers.image.description=Agent execution platform" \
            --label "org.opencontainers.image.url=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --push \
            .
          echo "pushed ${IMAGE}:${VERSION}"

      - name: Verify the published image serves its port
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          # Pull the amd64 manifest back and actually run it. Publishing an
          # image that cannot serve a request is the failure mode this whole
          # job exists to avoid, and it is exactly what shipped before: the
          # daemon bound loopback, so the published port reached nothing.
          docker run -d --name openseal-verify -p 18080:8080 --platform linux/amd64 "${IMAGE}:${VERSION}"

          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:18080/api/v1/health >/dev/null 2>&1; then
              echo "health endpoint answered on the published port after ${attempt} attempt(s)"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::published port never answered" >&2
              docker logs openseal-verify || true
              docker rm -f openseal-verify || true
              exit 1
            fi
            sleep 2
          done

          # The health check is declared in the image; confirm Docker agrees,
          # rather than only confirming that curl worked.
          for attempt in $(seq 1 30); do
            STATUS="$(docker inspect --format '{{.State.Health.Status}}' openseal-verify 2>/dev/null || echo unknown)"
            echo "container health: ${STATUS}"
            case "$STATUS" in
              healthy) break ;;
              unhealthy)
                echo "::error::container reported unhealthy" >&2
                docker logs openseal-verify || true
                docker rm -f openseal-verify || true
                exit 1 ;;
            esac
            if [ "$attempt" -eq 30 ]; then
              echo "::error::container never reached healthy (last status: ${STATUS})" >&2
              docker logs openseal-verify || true
              docker rm -f openseal-verify || true
              exit 1
            fi
            sleep 2
          done

          docker rm -f openseal-verify

  # ---------------------------------------------------------------------------
  # Desktop application bundles.
  #
  # Tauri does not cross-compile and tauri.conf.json sets bundle.targets to
  # "all", so each platform's installers must be produced on that platform.
  # The self-hosted fleet is Linux-only, hence hosted runners here.
  #
  # Every leg needs Go, Rust, Node and pnpm together, because the bundle embeds
  # the daemon: tauri.conf.json's beforeBuildCommand runs `pnpm prepare:daemon`,
  # which reads the Rust host triple and compiles the Go binary to
  # src-tauri/binaries/openseal-daemon-<triple>. That is the whole mechanism
  # behind the daemon being bundled, and it is why `pnpm tauri build` alone is
  # sufficient — no separate Go build step belongs in this job.
  desktop:
    name: Desktop (${{ matrix.label }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: linux-x86_64
          - runner: macos-13        # Intel
            label: macos-x86_64
          - runner: macos-latest    # Apple silicon
            label: macos-aarch64
          - runner: windows-latest
            label: windows-x86_64

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')" \
            fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD

      - name: Install the Linux bundling dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Tauri v2 links webkit2gtk 4.1. patchelf and librsvg are needed to
          # produce the AppImage.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential

      - name: Check the toolchains this bundle needs
        run: |
          set -euo pipefail
          missing=""
          for tool in go rustc cargo node npm; do
            command -v "$tool" >/dev/null 2>&1 || missing="${missing} ${tool}"
          done
          if [ -n "$missing" ]; then
            echo "::error::runner is missing required toolchains:${missing}" >&2
            exit 1
          fi
          # The sidecar filename is derived from this triple, so print it: if a
          # bundle ever ships without its daemon, this line identifies which
          # name was expected.
          rustc -vV | sed -n 's/^host: /rust host triple: /p'
          WANT="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          GOT="$(go version | awk '{print $3}' | sed 's/^go//')"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::Go toolchain is ${GOT} but go.mod requires ${WANT}" >&2
            exit 1
          fi
          echo "go ${GOT}, node $(node --version)"

      - name: Install pnpm
        run: |
          set -euo pipefail
          if ! command -v pnpm >/dev/null 2>&1; then
            npm install -g pnpm
          fi
          pnpm --version

      - name: Install the workspace dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build the bundles
        working-directory: desktop
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          # `pnpm tauri build`, not `make desktop-build`. The Makefile target
          # runs `make build` first, producing a root ./openseal that the bundle
          # never uses — tauri.conf.json's beforeBuildCommand compiles its own
          # sidecar under the Rust host triple. Skipping it avoids a redundant
          # cgo build on every leg.
          pnpm tauri build

      - name: Collect the bundles
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="bundles"
          mkdir -p "$OUT"
          BUNDLE_DIR="desktop/src-tauri/target/release/bundle"
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "::error::no bundle directory at ${BUNDLE_DIR}" >&2
            exit 1
          fi
          # Installers only. The .app directory is what the .dmg wraps, and a
          # directory cannot be a release asset.
          find "$BUNDLE_DIR" -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -exec cp {} "$OUT/" \;
          COUNT="$(find "$OUT" -type f | wc -l | tr -d ' ')"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::the build produced no installer for ${{ matrix.label }}" >&2
            find "$BUNDLE_DIR" -maxdepth 2 -type d || true
            exit 1
          fi
          echo "collected ${COUNT} installer(s) for ${{ matrix.label }}:"
          ls -l "$OUT"

      - name: Report the signing posture
        run: |
          set -euo pipefail
          # Signing is opt-in and absent by default. Say so in the log rather
          # than shipping unsigned artifacts silently: an unsigned .dmg trips
          # Gatekeeper and an unsigned installer trips SmartScreen, and whoever
          # ships this release should know that before users discover it.
          case "${{ runner.os }}" in
            macOS)
              echo "::warning::macOS bundles are UNSIGNED and not notarized — users will see a Gatekeeper warning. Set the signing secrets and add a signing step to change this."
              ;;
            Windows)
              echo "::warning::Windows installers are UNSIGNED — users will see a SmartScreen warning. Set the signing secrets and add a signing step to change this."
              ;;
            *)
              echo "Linux bundles are unsigned, which is conventional for .deb and .AppImage."
              ;;
          esac

      - name: Upload the bundles to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # --clobber so a re-run replaces its own assets rather than failing on
          # a name that already exists.
          find bundles -type f -print0 \
            | xargs -0 gh release upload "${GITHUB_REF_NAME}" --clobber
          echo "uploaded the ${{ matrix.label }} bundles"

  # ---------------------------------------------------------------------------
  # Assemble and publish.
  #
  # Depends on every artifact-producing job, so the release only becomes visible
  # once the binaries, the image and the desktop bundles have all succeeded. A
  # failure anywhere leaves the release a draft: incomplete and unpublished
  # beats published with holes in it.
  release:
    name: Checksum and publish
    needs: [binary, container, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out with full history for the changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          # Full history and tags, unlike the shallow fetch the build jobs use:
          # the changelog needs the commit range since the previous tag.
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')" \
            fetch -q --prune --tags origin
          git checkout -q --detach "$GITHUB_SHA"

      - name: Download every asset and checksum them together
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" --dir dist

          # A release with no assets means every upstream job uploaded nothing
          # while still reporting success. Fail rather than publish an empty
          # release.
          COUNT="$(find dist -maxdepth 1 -type f ! -name 'checksums.txt' | wc -l | tr -d ' ')"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::the draft release carries no assets" >&2
            exit 1
          fi
          echo "found ${COUNT} asset(s)"

          # One checksums file spanning binaries and desktop bundles alike, so a
          # user can verify whichever artifact they downloaded from one place.
          cd dist
          rm -f checksums.txt
          find . -maxdepth 1 -type f ! -name 'checksums.txt' -printf '%f\n' \
            | sort \
            | xargs sha256sum > checksums.txt
          cat checksums.txt

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
            HEADING="Changes since ${PREV}"
          else
            RANGE="${TAG}"
            HEADING="Changes"
          fi

          # Cap the changelog at 100 entries, and say so when it is cut.
          LIMIT=100
          TOTAL="$(git rev-list --no-merges --count "${RANGE}")"

          {
            echo "## OpenSeal ${VERSION}"
            echo
            echo "### Downloads"
            echo
            echo "- **Desktop app** — the \`.dmg\`, \`.msi\`, \`.deb\` or \`.AppImage\` below. The daemon is bundled; nothing else to install."
            echo "- **Command line** — the \`openseal_${VERSION}_<os>_<arch>\` archive for your platform."
            echo "- **Container** — \`docker pull ${IMAGE}:${VERSION}\`"
            echo
            echo "Verify any download against \`checksums.txt\`:"
            echo
            echo '```'
            echo "sha256sum -c checksums.txt --ignore-missing"
            echo '```'
            echo
            echo "### Note on unsigned builds"
            echo
            echo "The macOS and Windows desktop builds are not yet code-signed. macOS shows a Gatekeeper warning on first launch (right-click the app and choose Open), and Windows shows a SmartScreen prompt (More info, then Run anyway)."
            echo
            echo "### ${HEADING}"
            echo
            # `-n`, not `| head`. Piping into head under `set -euo pipefail`
            # kills the step: head closes the pipe after its 100th line, git
            # log takes SIGPIPE and exits 141, pipefail propagates it and set
            # -e aborts. That would abort this step before the final
            # `--draft=false` below, so every artifact would be built and
            # uploaded and then no release published at all — and SIGPIPE
            # prints nothing, so it would surface as a step failing silently.
            # It only bites once a range exceeds the cap, so it would pass
            # early releases and fail a later one with no change here.
            git log --no-merges -n "${LIMIT}" --pretty='- %s' "${RANGE}"
            if [ "${TOTAL}" -gt "${LIMIT}" ]; then
              echo "- …and $(( TOTAL - LIMIT )) more commits"
            fi
          } > notes.md

          gh release edit "${TAG}" --notes-file notes.md

      - name: Upload the checksums and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" dist/checksums.txt --clobber
          # --draft=false is the single step that makes the release visible.
          # Everything above this line is reversible by deleting a draft.
          gh release edit "${GITHUB_REF_NAME}" --draft=false
          echo "published ${GITHUB_REF_NAME}"
