  - config:
      code: "from io import BytesIO\nimport tempfile\nimport extract_msg\nimport base64\nimport mammoth\n\nfrom pdfminer.high_level import extract_text_to_fp\nfrom pdfminer.layout import LAParams\nfrom pdfminer.converter import HTMLConverter\nfrom pdfminer.pdfinterp import PDFResourceManager\n\nATTACHMENTS_START = \"<!--__ATTACHMENTS_START__-->\"\nATTACHMENT_DELIM = \"<!--__ATTACHMENT__-->\"\nATTACHMENTS_END = \"<!--__ATTACHMENTS_END__-->\"\n\ndef s(value):\n    if value is None:\n        return \"\"\n    if isinstance(value, (bytes, bytearray)):\n        return value.decode(\"utf-8\", errors=\"ignore\")\n    return str(value)\n\ndef pdf_bytes_to_html(pdf_bytes: bytes) -> str:\n    input_stream = BytesIO(pdf_bytes)\n    output_stream = BytesIO()\n    resource_manager = PDFResourceManager()\n    laparams = LAParams(all_texts=True, detect_vertical=True, word_margin=0.1, char_margin=2.0, line_margin=0.5)\n    converter = HTMLConverter(resource_manager, output_stream, laparams=laparams, codec=\"utf-8\", scale=1.0)\n    try:\n        extract_text_to_fp(input_stream, output_stream, laparams=laparams, output_type=\"html\", codec=\"utf-8\", device=converter)\n        return output_stream.getvalue().decode(\"utf-8\", errors=\"ignore\")\n    finally:\n        converter.close()\n        input_stream.close()\n        output_stream.close()\n\ndef docx_bytes_to_html(docx_bytes: bytes) -> str:\n    docx_file_like = BytesIO(docx_bytes)\n    result = mammoth.convert_to_html(docx_file_like)\n    return result.value\n\ndef msg_bytes_to_html(data) -> dict:\n    if isinstance(data, str):\n        try:\n            data = base64.b64decode(data, validate=True)\n        except Exception:\n            raise ValueError(\"MSG input must be bytes or base64 string\")\n    if not isinstance(data, (bytes, bytearray)):\n        raise TypeError(\"MSG input must be bytes\")\n    attachment_blocks = []\n    with tempfile.NamedTemporaryFile(suffix=\".msg\") as tmp:\n        tmp.write(data)\n        tmp.flush()\n        msg = extract_msg.Message(tmp.name)\n    subject = s(msg.subject) or \"No Subject\"\n    sender = s(msg.sender) or \"Unknown\"\n    to = s(msg.to)\n    cc = s(msg.cc)\n    date = s(msg.date)\n    if msg.htmlBody:\n        body_html = s(msg.htmlBody)\n    else:\n        body_html = s(msg.body).replace(\"\\n\", \"<br>\")\n    for att in msg.attachments:\n        filename = s(att.longFilename or att.shortFilename or \"\").strip()\n        if not filename:\n            continue\n        lower = filename.lower()\n        if lower.endswith((\".png\", \".jpg\", \".jpeg\", \".gif\", \".webp\", \".bmp\", \".svg\")):\n            continue\n        try:\n            if lower.endswith(\".docx\"):\n                attachment_html = docx_bytes_to_html(att.data)\n            elif lower.endswith(\".pdf\"):\n                attachment_html = pdf_bytes_to_html(att.data)\n            else:\n                attachment_html = f\"<p>{filename}</p>\"\n        except Exception as e:\n            attachment_html = f\"<pre>Failed to render attachment: {s(e)}</pre>\"\n        attachment_blocks.append(f\"<div class=\"attachment\"><h3>{filename}</h3>{attachment_html}</div>\")\n    final_html = f\"<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>{subject}</title><style>body {{ font-family: Arial, sans-serif; margin: 20px; }}</style></head><body><div class=\"header\"><p><span class=\"label\">From:</span> {sender}</p><p><span class=\"label\">To:</span> {to}</p><p><span class=\"label\">CC:</span> {cc}</p><p><span class=\"label\">Subject:</span> {subject}</p><p><span class=\"label\">Date:</span> {date}</p></div><div class=\"body\">{body_html}</div>{ATTACHMENTS_START}{ATTACHMENT_DELIM.join(attachment_blocks)}{ATTACHMENTS_END}</body></html>\"\n    return {\"html\": final_html}\n\nresult = msg_bytes_to_html(get_file(nodes[\"File-Upload\"][\"document\"]))"
      language: python
