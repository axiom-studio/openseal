  - config:
      code: "from io import BytesIO\nimport fitz\nimport pikepdf\nfrom xml.etree import ElementTree as ET\n\ndef _is_xfa_pdf(pdf_bytes):\n    try:\n        pdf = pikepdf.Pdf.open(BytesIO(pdf_bytes))\n        acroform = pdf.Root.get(\"/AcroForm\")\n        if acroform and \"/XFA\" in acroform:\n            return True\n        return False\n    except Exception:\n        return False\n\ndef _extract_xfa_xml(pdf_bytes):\n    pdf = pikepdf.Pdf.open(BytesIO(pdf_bytes))\n    xfa_array = pdf.Root.AcroForm.XFA\n    xfa_dict = {}\n    if isinstance(xfa_array, pikepdf.Array):\n        for i in range(0, len(xfa_array), 2):\n            label = str(xfa_array[i])\n            stream = xfa_array[i + 1]\n            if isinstance(stream, pikepdf.Stream):\n                xfa_dict[label] = stream.read_bytes().decode(\"utf-8\")\n    elif isinstance(xfa_array, pikepdf.Stream):\n        xfa_dict[\"xfa\"] = xfa_array.read_bytes().decode(\"utf-8\")\n    pdf.close()\n    return xfa_dict\n\ndef pdf_bytes_to_html():\n    pdf_bytes = get_file(nodes['File-Upload']['document'])\n    if not pdf_bytes:\n        return {\"success\": False, \"html\": \"\", \"error\": \"Empty or missing PDF file\"}\n    try:\n        if _is_xfa_pdf(pdf_bytes):\n            xfa_dict = _extract_xfa_xml(pdf_bytes)\n            html = _xfa_xml_to_html(xfa_dict)\n        else:\n            html = _extract_standard_pdf(pdf_bytes)\n        return {\"success\": True, \"html\": html}\n    except Exception as e:\n        return {\"success\": False, \"html\": \"\", \"error\": str(e)}\n\nresult = pdf_bytes_to_html()"
      language: python
      requirements:
      - pymupdf
